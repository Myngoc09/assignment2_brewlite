services:
  - type: web
    name: brewlite-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: brewlite-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: API_PORT
        value: 3001
      - key: WEB_ORIGIN
        sync: false
  - type: web
    name: brewlite-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_SERVER_URL
        sync: false
databases:
  - name: brewlite-db
    databaseName: brewlite
    user: brewlite
    plan: basic-256mb
