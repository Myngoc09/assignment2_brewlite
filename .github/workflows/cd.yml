name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: Temporary HTTPS URL for the production smoke test
        required: false
        type: string
      smoke_revision:
        description: Existing image SHA to run only the smoke test
        required: false
        type: string

permissions:
  contents: read
defaults:
  run:
    shell: bash
 
jobs:
  quality:
    if: "!inputs.smoke_revision"
    uses: ./.github/workflows/ci.yml

  image:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BREWLITE_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }},mode=max,ignore-error=true

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both multi-architecture tags
        run: |
          for app in api web; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$app:$GITHUB_SHA"
            docker buildx imagetools create -t "$image" "$image-amd64" "$image-arm64"
          done

  gitops:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the production image tags together
        id: promote
        run: |
          production="$(git ls-remote --heads origin refs/heads/production)"
          if [[ -n "$production" ]]; then
            git fetch origin production
            git switch --detach FETCH_HEAD
            git read-tree --reset -u "$GITHUB_SHA"
          fi
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::notice::main has moved. Skipping deployment of $GITHUB_SHA."
            exit 0
          fi
          cd k8s/overlays/prod
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -i -e "s|newName: .*\/api$|newName: $prefix/api|" \
            -e "s|newName: .*\/web$|newName: $prefix/web|" \
            -e "s|newTag: .*|newTag: $GITHUB_SHA|" kustomization.yaml
          kubectl kustomize . > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Deploy BrewLite $GITHUB_SHA"
          fi
          git push origin HEAD:refs/heads/production
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  smoke:
    needs: gitops
    if: ${{ !cancelled() && (needs.gitops.outputs.promoted == 'true' || inputs.smoke_revision != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_WEB_URL: ${{ inputs.smoke_url || vars.PRODUCTION_WEB_URL }}
      BREWLITE_REVISION: ${{ inputs.smoke_revision || github.sha }}
      SMOKE_ONLY: ${{ inputs.smoke_revision != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the deployed revision over HTTPS
        run: |
          if [[ -z "$PRODUCTION_WEB_URL" ]]; then
            if [[ "$SMOKE_ONLY" == true ]]; then
              echo "::error::Provide smoke_url or set PRODUCTION_WEB_URL."
              exit 1
            fi
            echo "::warning::Production HTTPS smoke test not configured. Set PRODUCTION_WEB_URL or supply smoke_url."
            exit 0
          fi
          node .github/scripts/smoke-production.mjs
