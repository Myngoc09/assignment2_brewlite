name: brewlite-deploy
on:
  push:
    branches: [main]
    tags: ['v*']
permissions: { contents: write, packages: write }
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production configuration
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          WEB: ${{ vars.PRODUCTION_WEB_URL }}
          API: ${{ vars.PRODUCTION_API_URL }}
        run: |
          missing=()
          [[ -n "$RENDER_API_KEY" ]] || missing+=(RENDER_API_KEY)
          [[ -n "$RENDER_API_SERVICE_ID" ]] || missing+=(RENDER_API_SERVICE_ID)
          [[ -n "$RENDER_WEB_SERVICE_ID" ]] || missing+=(RENDER_WEB_SERVICE_ID)
          [[ -n "$WEB" ]] || missing+=(PRODUCTION_WEB_URL)
          [[ -n "$API" ]] || missing+=(PRODUCTION_API_URL)
          if (( ${#missing[@]} )); then
            echo "::error::Missing configuration in Settings > Secrets and variables > Actions: ${missing[*]}"
            exit 1
          fi
  quality:
    needs: configuration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_local
          POSTGRES_DB: brewlite
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_local@localhost:5432/brewlite?schema=public
      - run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_local@localhost:5432/brewlite?schema=public
      - run: npm run db:seed
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_local@localhost:5432/brewlite?schema=public
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_local@localhost:5432/brewlite?schema=public
          JWT_SECRET: ci-secret-for-tests-at-least-32-characters
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_local@localhost:5432/brewlite?schema=public
          JWT_SECRET: ci-secret-for-tests-at-least-32-characters
      - run: npm run build
  image:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: "${{ steps.image.outputs.prefix }}/${{ matrix.app }}:${{ github.sha }}"
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max,ignore-error=true
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: brewlite-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy the tested commit and verify production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          WEB: ${{ vars.PRODUCTION_WEB_URL }}
          API: ${{ vars.PRODUCTION_API_URL }}
        run: node .github/scripts/deploy-render.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
