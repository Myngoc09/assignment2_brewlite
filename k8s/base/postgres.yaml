apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brewlite-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewlite-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brewlite-postgres
  template:
    metadata:
      labels:
        app: brewlite-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: brewlite
            - name: POSTGRES_DB
              value: brewlite
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brewlite-runtime
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "brewlite", "-d", "brewlite"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: brewlite-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: brewlite-postgres
spec:
  selector:
    app: brewlite-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
