apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewlite-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brewlite-api
  template:
    metadata:
      labels:
        app: brewlite-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: brewlite-api
          command: ["sh", "-ec"]
          args:
            - npm run db:deploy && npm run db:seed -- --catalog-only
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: brewlite-runtime
                  key: DATABASE_URL
      containers:
        - name: api
          image: brewlite-api
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: brewlite-runtime
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: brewlite-runtime
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: brewlite-api
spec:
  selector:
    app: brewlite-api
  ports:
    - name: http
      port: 3001
      targetPort: http
