apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewlite-cloudflared
  namespace: brewlite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brewlite-cloudflared
  template:
    metadata:
      labels:
        app: brewlite-cloudflared
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: brewlite-cloudflare
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
